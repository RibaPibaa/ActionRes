
name: Build Tactical Arena

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Forge Mod
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Check project structure
        shell: bash
        run: |
          echo "Repository contents:"
          ls -la

          if [ ! -f build.gradle ] && [ ! -f build.gradle.kts ]; then
            echo "::error::build.gradle not found in repository root!"
            exit 1
          fi

          if [ ! -f settings.gradle ] && [ ! -f settings.gradle.kts ]; then
            echo "::error::settings.gradle not found in repository root!"
            exit 1
          fi

          if [ ! -d src/main/java ]; then
            echo "::error::src/main/java directory not found!"
            exit 1
          fi

          echo "Project structure looks OK."

      - name: Build Tactical Arena
        run: gradle --no-daemon clean build --stacktrace

      - name: Show generated JAR
        run: |
          echo "Generated files:"
          ls -lh build/libs/

      - name: Upload Tactical Arena JAR
        uses: actions/upload-artifact@v4
        with:
          name: TacticalArena-Forge-1.20.1
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 30

      - name: Upload build reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TacticalArena-build-reports
          path: build/reports/
          if-no-files-found: ignore
          retention-days: 7
