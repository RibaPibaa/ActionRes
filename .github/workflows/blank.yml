
name: Build Tactical Arena

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Find Gradle project
        id: locate
        shell: bash
        run: |
          PROJECT_FILE=$(find . \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -not -path "*/.git/*" \
            -not -path "*/.gradle/*" \
            | head -n 1)

          if [ -z "$PROJECT_FILE" ]; then
            PROJECT_FILE=$(find . \
              -type f \
              \( -name "build.gradle" -o -name "build.gradle.kts" \) \
              -not -path "*/.git/*" \
              -not -path "*/.gradle/*" \
              | head -n 1)
          fi

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: Gradle project not found!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          echo "Gradle project found in: $PROJECT_DIR"

      - name: Build Tactical Arena
        run: gradle --no-daemon clean build
        working-directory: ${{ steps.locate.outputs.dir }}

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: TacticalArena-Forge-1.20.1
          path: ${{ steps.locate.outputs.dir }}/build/libs/TacticalArena-*.jar
          if-no-files-found: error
          retention-days: 30

      - name: Upload sources
        uses: actions/upload-artifact@v4
        with:
          name: TacticalArena-source
          path: |
            ${{ steps.locate.outputs.dir }}/src/
            ${{ steps.locate.outputs.dir }}/build.gradle
            ${{ steps.locate.outputs.dir }}/settings.gradle
            ${{ steps.locate.outputs.dir }}/gradle.properties
            ${{ steps.locate.outputs.dir }}/README.md
          if-no-files-found: warn
          retention-days: 30
