
name: Build Tactical Arena

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Tactical Arena Forge 1.20.1
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      # 1. Download repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Install Gradle 8.8
      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      # 4. Extract project archive if necessary
      - name: Extract Tactical Arena
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p _source

          if [ -f "build.gradle" ] || [ -f "build.gradle.kts" ]; then
            echo "Gradle project already exists in repository root."
            exit 0
          fi

          ARCHIVE="TacticalArena-GitHub-root.zip"

          if [ ! -f "$ARCHIVE" ]; then
            echo "::error::Tactical Arena ZIP archive not found: $ARCHIVE"
            echo "Repository contents:"
            ls -la
            exit 1
          fi

          echo "Checking ZIP archive..."
          unzip -t "$ARCHIVE"

          echo "Extracting project..."
          unzip -oq "$ARCHIVE" -d _source

          echo "Extracted files:"
          find _source -maxdepth 5 -type f | sort | head -100

      # 5. Locate Gradle project
      - name: Find Gradle project
        id: locate
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "build.gradle" ] || [ -f "build.gradle.kts" ]; then
            PROJECT_DIR="."
          else
            PROJECT_FILE=$(find _source \
              -type f \
              \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
              -not -path "*/.gradle/*" \
              | sort | head -n 1 || true)

            if [ -z "$PROJECT_FILE" ]; then
              PROJECT_FILE=$(find _source \
                -type f \
                \( -name "build.gradle" -o -name "build.gradle.kts" \) \
                -not -path "*/.gradle/*" \
                | sort | head -n 1 || true)
            fi

            if [ -z "$PROJECT_FILE" ]; then
              echo "::error::Gradle project not found inside archive!"
              exit 1
            fi

            PROJECT_DIR=$(dirname "$PROJECT_FILE")
          fi

          if [ ! -f "$PROJECT_DIR/build.gradle" ] && \
             [ ! -f "$PROJECT_DIR/build.gradle.kts" ]; then
            echo "::error::build.gradle missing in $PROJECT_DIR"
            exit 1
          fi

          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          echo "Gradle project found:"
          echo "$PROJECT_DIR"

          echo "Project files:"
          ls -la "$PROJECT_DIR"

      # 6. Check Java and Gradle
      - name: Verify build environment
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          java -version
          gradle --version

      # 7. Build mod
      - name: Build Tactical Arena
        working-directory: ${{ steps.locate.outputs.dir }}
        run: gradle --no-daemon clean build --stacktrace

      # 8. Show generated JAR
      - name: Show build output
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          echo "Generated JAR files:"
          ls -lh build/libs/

      # 9. Upload mod
      - name: Upload Tactical Arena JAR
        uses: actions/upload-artifact@v4
        with:
          name: TacticalArena-Forge-1.20.1
          path: ${{ steps.locate.outputs.dir }}/build/libs/*.jar
          if-no-files-found: error
          retention-days: 30

      # 10. Upload reports if build fails
      - name: Upload build reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TacticalArena-build-reports
          path: _source/**/build/reports/
          if-no-files-found: ignore
          retention-days: 7
